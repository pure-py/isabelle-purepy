name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Primary site redirects to host runners cannot reach, so take distribution from mirror.
  ISABELLE_VERSION: Isabelle2025-2
  ISABELLE_MIRRORS: >-
    https://mirror.clarkson.edu/isabelle/dist
    https://proofcraft.systems/isabelle/dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Isabelle
        id: cache-isabelle
        uses: actions/cache@v4
        with:
          path: ~/isabelle
          key: ${{ runner.os }}-${{ env.ISABELLE_VERSION }}

      - name: Install Isabelle
        if: steps.cache-isabelle.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p ~/isabelle
          for mirror in $ISABELLE_MIRRORS; do
            echo "Trying $mirror"
            if curl -sSfL --retry 3 --connect-timeout 20 \
                 "$mirror/${ISABELLE_VERSION}_linux.tar.gz" \
                 | tar -xz -C ~/isabelle --strip-components=1; then
              exit 0
            fi
          done
          echo "No mirror served ${ISABELLE_VERSION}" >&2
          exit 1

      - name: Build session
        run: ~/isabelle/bin/isabelle build -v -o document=false -D .
