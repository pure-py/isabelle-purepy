name: build

on:
  push:
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "isabelle=$(cat .isabelle-version)" >> "$GITHUB_OUTPUT"

  build:
    name: proof checking, type checker generation and conformance under CPython
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      # Official image, with HOL prebuilt. Runs as root so that checkout and apt can write.
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install make and git
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends make git

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check proofs and generate type checker
        timeout-minutes: 30
        run: make build ISABELLE=/home/isabelle/Isabelle/bin/isabelle

      - name: Lint, run conformance suite and build wheel
        run: make wheel

      - name: Run conformance suite under the reference interpreter
        run: uv run --locked ./test/check-conformance.sh "python -m purepy" --no-lint

      - name: Install type checker, with the conformance package, into site
        run: uv pip install --target site dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # Run the programs of the suite under other Python runtimes, with harness and type checker under CPython
  runtimes:
    name: conformance suite under ${{ matrix.runtime }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: GraalPy
            version: "graalpy-25.2"
          - runtime: Pyodide
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Set up GraalPy
        if: matrix.runtime == 'GraalPy'
        id: graalpy
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
          update-environment: false

      - name: Set up uv for Pyodide
        if: matrix.runtime == 'Pyodide'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Pyodide
        if: matrix.runtime == 'Pyodide'
        run: |
          uv python install "pyodide@$(cat .python-version)"
          PYODIDE_PYTHON="$(uv python find "pyodide@$(cat .python-version)")"
          echo "PYODIDE_PYTHON=$PYODIDE_PYTHON" >> "$GITHUB_ENV"

      - name: Run tests with GraalPy
        if: matrix.runtime == 'GraalPy'
        env:
          PYTHONPATH: ${{ github.workspace }}/site
        run: test/check-conformance.sh "${{ steps.graalpy.outputs.python-path }}" --no-lint

      - name: Run tests with Pyodide
        if: matrix.runtime == 'Pyodide'
        env:
          PYTHONPATH: ${{ github.workspace }}/site
        run: test/check-conformance.sh "$PYODIDE_PYTHON" --no-lint
