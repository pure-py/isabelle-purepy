name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official image, with HOL prebuilt. Runs as root so that checkout can write workspace.
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build session
        timeout-minutes: 20
        run: /home/isabelle/Isabelle/bin/isabelle build -v -o document=false -D .
