name: build

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "isabelle=$(cat .isabelle-version)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official image, with HOL prebuilt. Runs as root so that checkout and apt can write.
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install make, git and Python
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends make git python3

      - uses: actions/checkout@v4

      - name: Register the Python code generator as a component
        run: |
          git clone --depth 1 https://github.com/pure-py/isabelle-python-codegen.git /opt/isabelle-python-codegen
          /home/isabelle/Isabelle/bin/isabelle components -u /opt/isabelle-python-codegen

      - name: Build session
        timeout-minutes: 20
        run: make build ISABELLE=/home/isabelle/Isabelle/bin/isabelle
