name: build

on:
  push:
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      isabelle: ${{ steps.read.outputs.isabelle }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "isabelle=$(cat .isabelle-version)" >> "$GITHUB_OUTPUT"

  build:
    name: proofs, type checker and conformance suite
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official image, with HOL prebuilt. Runs as root so that checkout and apt can write.
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install make and git
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends make git

      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check proofs and generate type checker
        timeout-minutes: 20
        run: make build ISABELLE=/home/isabelle/Isabelle/bin/isabelle

      - name: Lint, run conformance suite and build wheel
        run: make wheel

      - name: Install type checker and conformance package into site
        run: uv pip install --target site dist/*.whl "$(uv export --locked --only-group dev --no-hashes --no-emit-project | grep '^purepy-conformance ')"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # Suite and type checker under other Python runtimes, from the site directory of the build job
  runtimes:
    name: conformance suite (${{ matrix.runtime }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: GraalPy
            version: "graalpy-25.2"
          - runtime: Pyodide
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Set up GraalPy
        if: matrix.runtime == 'GraalPy'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}

      - name: Set up uv for Pyodide
        if: matrix.runtime == 'Pyodide'
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Pyodide
        if: matrix.runtime == 'Pyodide'
        run: |
          uv python install "pyodide@$(cat .python-version)"
          PYODIDE_PYTHON="$(uv python find "pyodide@$(cat .python-version)")"
          echo "PYODIDE_PYTHON=$PYODIDE_PYTHON" >> "$GITHUB_ENV"

      - name: Run tests with GraalPy
        if: matrix.runtime == 'GraalPy'
        env:
          PYTHONPATH: ${{ github.workspace }}/site
        run: test/check-conformance.sh python --no-lint

      - name: Run tests with Pyodide
        if: matrix.runtime == 'Pyodide'
        env:
          PYTHONPATH: ${{ github.workspace }}/site
        run: test/check-conformance.sh "$PYODIDE_PYTHON" --no-lint
