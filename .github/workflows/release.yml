name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      isabelle: ${{ steps.version.outputs.isabelle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check version against pinned conformance suite
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          SPEC="$(sed -n 's|.*/purepy_conformance-\([0-9.]*\)-py3-none-any\.whl.*|\1|p' pyproject.toml)"
          case "$VERSION" in
            "$SPEC" | "$SPEC".post*) ;;
            *) echo "version $VERSION is not that of purepy-conformance $SPEC"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "isabelle=$(cat .isabelle-version)" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: makarius/isabelle:${{ needs.version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install make, git and zip
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends make git zip

      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check proofs and generate type checker
        timeout-minutes: 30
        run: make build ISABELLE=/home/isabelle/Isabelle/bin/isabelle

      - name: Lint, run conformance suite and build wheel
        run: make wheel

      - name: Build sources archive
        run: |
          # Allow git on checkout, since container user doesn't own checkout
          git config --global --add safe.directory '*'
          make dist/isabelle-purepy-sources.zip

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.commit }}
          files: |
            dist/*.whl
            dist/isabelle-purepy-sources.zip
            names.txt
