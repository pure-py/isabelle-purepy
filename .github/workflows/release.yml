name: Release

# Version from the pinned purepy-conformance release: that of the specification the type checker passes, with a
# post-release suffix for a further release against the same specification
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      isabelle: ${{ steps.version.outputs.isabelle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Derive version from pinned conformance suite
        id: version
        run: |
          SPEC="$(sed -n 's|.*/purepy_conformance-\([0-9.]*\)-py3-none-any\.whl.*|\1|p' pyproject.toml)"
          test -n "$SPEC" || { echo "pyproject.toml must pin a purepy-conformance release"; exit 1; }
          git fetch --tags origin
          VERSION="$SPEC"
          N=0
          while git rev-parse -q --verify "v$VERSION" >/dev/null; do
            N=$((N + 1))
            VERSION="$SPEC.post$N"
          done
          uv version "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "isabelle=$(cat .isabelle-version)" >> "$GITHUB_OUTPUT"

      - name: Commit and push version change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git diff --cached --quiet || git commit -m "Bump version to ${{ steps.version.outputs.tag }}"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main

      - name: Create and push tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    needs: bump-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: makarius/isabelle:${{ needs.bump-version.outputs.isabelle }}
      options: --user root
    steps:
      - name: Install make and git
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends make git

      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Check proofs and generate type checker
        timeout-minutes: 20
        run: make build ISABELLE=/home/isabelle/Isabelle/bin/isabelle

      - name: Lint, run conformance suite and build wheel
        run: make wheel

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          files: dist/*.whl
