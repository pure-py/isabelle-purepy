name: Release

# Release main without rebuilding
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check version against pinned conformance suite
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          SPEC="$(sed -n 's|.*/purepy_conformance-\([0-9.]*\)-py3-none-any\.whl.*|\1|p' pyproject.toml)"
          case "$VERSION" in
            "$SPEC" | "$SPEC".post*) ;;
            *) echo "version $VERSION is not that of purepy-conformance $SPEC"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download files kept by passing build
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          RUN="$(gh run list --workflow build.yml --commit "$COMMIT" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN" || { echo "no passing build of $COMMIT"; exit 1; }
          gh run download "$RUN" --name release --dir release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.version.outputs.commit }}
          files: |
            release/dist/*
            release/names.txt
