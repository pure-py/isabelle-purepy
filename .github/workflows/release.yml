name: Release

# Release main without rebuilding
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Release older commit when later commits change only README, since build workflow skips such commits
      - name: Find latest commit on main with passing build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r RUN COMMIT < <(gh run list --workflow build.yml --branch main --status success --limit 1 \
            --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          test -n "$COMMIT" || { echo "no passing build on main"; exit 1; }
          CHANGED="$(git diff --name-only "$COMMIT" HEAD | grep -vx README.md || true)"
          test -z "$CHANGED" || { echo "commits after $COMMIT change $CHANGED"; exit 1; }
          git checkout -q "$COMMIT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check version against pinned conformance suite
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          SPEC="$(sed -n 's|.*/purepy_conformance-\([0-9.]*\)-py3-none-any\.whl.*|\1|p' pyproject.toml)"
          case "$VERSION" in
            "$SPEC" | "$SPEC".post*) ;;
            *) echo "version $VERSION is not that of purepy-conformance $SPEC"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download files kept by passing build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.build.outputs.run }}" --name release --dir release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.build.outputs.commit }}
          files: |
            release/dist/*
            release/names.txt
