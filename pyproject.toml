[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy"
description = "reference implementation"
version = "0.26.0"
requires-python = ">=3.12"
dependencies = [
    "purepy-conformance @ https://github.com/pure-py/pure-py-spec/releases/download/v0.26.0/purepy_conformance-0.26.0-py3-none-any.whl",
]

[project.scripts]
purepy = "purepy.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

# Generated code untyped; not followed by mypy
[[tool.mypy.overrides]]
module = ["purepy.generated.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy/generated"]

# Dependency on a release asset of the specification
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/purepy"]
# Generated by the build, not committed
artifacts = ["src/purepy/generated/"]
