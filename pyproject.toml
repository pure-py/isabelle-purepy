[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy"
version = "0.24.0"
requires-python = ">=3.12"

[project.scripts]
purepy = "purepy.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "purepy-conformance @ https://github.com/pure-py/pure-py-spec/releases/download/v0.23.2/purepy_conformance-0.23.2-py3-none-any.whl",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

# Generated code, untyped, so its definitions are Any to the front end
[[tool.mypy.overrides]]
module = ["purepy.generated.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy/generated"]

[tool.hatch.build.targets.wheel]
packages = ["src/purepy"]
# Generated by the build, not committed
artifacts = ["src/purepy/generated/"]
