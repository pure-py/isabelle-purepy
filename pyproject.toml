[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purepy"
version = "0.23.0"
requires-python = ">=3.12"

[project.scripts]
purepy = "purepy.__main__:main"
purepy-conformance = "purepy.conformance:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true

# Generated code, untyped, so its definitions are Any to the front end
[[tool.mypy.overrides]]
module = ["purepy.generated.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
extend-exclude = ["src/purepy/conformance-suite", "src/purepy/generated"]

[tool.hatch.build.targets.wheel]
packages = ["src/purepy"]
# Generated by the build, not committed
artifacts = ["src/purepy/generated/"]
